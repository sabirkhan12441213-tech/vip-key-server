<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro VPN Admin Panel</title>
    <style>
        body { background-color: #0f172a; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 25px; border-radius: 12px; width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.6); box-sizing: border-box; }
        input, select, textarea { width: 100%; padding: 10px; margin: 10px 0; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; box-sizing: border-box; font-family: monospace; font-size: 12px; }
        button { width: 100%; padding: 10px; background: #22c55e; border: none; border-radius: 6px; color: #fff; font-weight: bold; cursor: pointer; margin-top: 5px; }
        button:hover { background: #16a34a; }
        .error { color: #ef4444; font-size: 14px; margin-top: 10px; text-align: center; }
        .hidden { display: none !important; }
        h3 { text-align: center; margin-top: 0; }
        .key-box { background: #090d16; padding: 10px; border-radius: 6px; margin-top: 10px; font-size: 12px; color: #38bdf8; word-break: break-all; }
    </style>
</head>
<body>

<div class="card" id="loginScreen">
    <h3>Admin Login</h3>
    <input type="password" id="adminPass" placeholder="Enter Password">
    <button onclick="checkAdminPassword()">Login</button>
    <div id="loginError" class="error"></div>
</div>

<div class="card hidden" id="adminPanel">
    <h3>Key Generator</h3>
    
    <label>Key Name:</label>
    <input type="text" id="customKey" placeholder="e.g. LG-KEY-01">
    
    <label>Duration:</label>
    <select id="durationSelect">
        <option value="0.001388">5 Seconds (Testing)</option>
        <option value="1">1 Hour</option>
        <option value="24">1 Day (24 Hours)</option>
    </select>

    <button onclick="generateKey()">Generate & Copy JSON</button>
    
    <label style="margin-top:15px; display:block;">Copy this JSON to your GitHub keys.json:</label>
    <textarea id="jsonOutput" rows="5" readonly placeholder="JSON data will appear here..."></textarea>
</div>

<script>
    const MASTER_SERVER_PASSWORD = "AliAbbas2";

    function checkAdminPassword() {
        const pass = document.getElementById('adminPass').value.trim();
        if(pass === MASTER_SERVER_PASSWORD) {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('adminPanel').classList.remove('hidden');
            loadExistingKeys();
        } else {
            document.getElementById('loginError').innerText = "Wrong Password";
        }
    }

    function getKeys() {
        return JSON.parse(localStorage.getItem('admin_keys_list') || '[]');
    }

    function loadExistingKeys() {
        let keys = getKeys();
        document.getElementById('jsonOutput').value = JSON.stringify(keys, null, 2);
    }

    function generateKey() {
        const keyName = document.getElementById('customKey').value.trim();
        const durationHours = parseFloat(document.getElementById('durationSelect').value);

        if(!keyName) {
            alert("Please enter a key name!");
            return;
        }

        let keys = getKeys();
        if(keys.some(k => k.name === keyName)) {
            alert("This key already exists!");
            return;
        }

        keys.push({
            name: keyName,
            durationHours: durationHours,
            startTime: null,
            status: "active"
        });

        localStorage.setItem('admin_keys_list', JSON.stringify(keys));
        
        let jsonString = JSON.stringify(keys, null, 2);
        document.getElementById('jsonOutput').value = jsonString;
        document.getElementById('customKey').value = "";
        
        // ऑटोमेटिक क्लिपबोर्ड पर कॉपी करने की कोशिश
        navigator.clipboard.writeText(jsonString).then(() => {
            alert("Key generated & JSON copied to clipboard! Now paste it into your GitHub keys.json file.");
        }).catch(() => {
            alert("Key generated! Copy the JSON from the box below.");
        });
    }
</script>
</body>
</html>
